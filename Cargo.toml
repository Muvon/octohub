[package]
name = "octohub"
version = "0.7.4"
edition = "2021"
authors = ["Muvon Un Limited <contact@muvon.io>"]
license = "Apache-2.0"
description = "High-performance LLM proxy server with completion chaining and full request/response logging"

[dependencies]
octolib = { version = "0.33.1", default-features = false }
# octolib = { path = "../octolib", default-features = false }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.35", features = ["bundled"] }
mysql = { version = "28", default-features = false, features = ["minimal", "native-tls"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
ulid = "1"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
